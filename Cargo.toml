[package]
name = "aniscrobble"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[features]
default = ["native-tls", "tui"]
native-tls = ["ureq/native-tls"]
vendored = ["ureq/vendored"]
brotli = ["ureq/brotli"]
tui = [
    "dep:crossterm",
    "dep:futures",
    "dep:image",
    "dep:ratatui",
    "dep:ratatui-image",
    "dep:reqwest",
    "dep:tokio",
    "dep:tokio-util",
]

[dependencies]
anyhow = { version = "1.0.98", features = ["backtrace"] }
bincode = { version = "1.3.3" }
clap = { version = "4.5.39", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
directories = "6.0.0"
futures = { version = "0.3", optional = true }
image = { version = "0.25", optional = true }
open = "5.3.2"
ratatui = { version = "0.30", optional = true }
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"], optional = true }
rustyline = "17.0.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"], optional = true }
tokio-util = { version = "0.7", optional = true }
ureq = { version = "3.0.11", features = ["json", "platform-verifier"] }

[dependencies.heed]
version = "0.22.0"
default-features = false
features = ["serde", "serde-bincode"]

[target.'cfg(not(windows))'.dependencies]
libc = "0.2.172"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
